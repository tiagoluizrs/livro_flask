services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MYSQL_DATABASE: livro_flask
    volumes:
      - livro_flask_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      FLASK_APP: "run.py"
      IP_HOST: "0.0.0.0"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "123"
      MYSQL_DATABASE: livro_flask
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  livro_flask_mysql_data:
